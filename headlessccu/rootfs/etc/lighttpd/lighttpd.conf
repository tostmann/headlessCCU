# SPDX-License-Identifier: GPL-2.0-or-later
# BusMatic-HASS lighttpd — schlanker Reverse-Proxy.
#
# Endpoints, die aiohomematic-via-homematicip_local braucht:
#   :80    →  rega_session_mock (127.0.0.1:8765) — JSON-RPC /api/homematic.cgi
#
# :2001 und :2010 werden NICHT mehr von lighttpd bedient — der ping_shim
# (siehe headlessccu/ping_shim.py) bindet diese Ports direkt und macht
# XML-RPC-reverse-proxy mit ping-pong-Interception (rfd's native ping
# antwortet mit fault, was aiohomematic's PingPongTracker dauernd auf
# "unavailable" flippt; der shim antwortet ping/PONG CCU-konform).
#
# Kein WebUI, kein :8181, kein :1999, kein magnet/ReGa — den Frontend-Pfad
# übernimmt Home Assistant.
#
# Lizenz: GPL-2.0-or-later

server.modules = ( "mod_proxy", "mod_accesslog" )

server.document-root        = "/var/www/html"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.errorlog             = "/var/log/lighttpd/error.log"
accesslog.filename          = "/var/log/lighttpd/access.log"
server.pid-file             = "/run/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"

server.bind                 = "0.0.0.0"
server.port                 = 80

$SERVER["socket"] == ":80" {
  proxy.server = ( "" => ( "rega" => ( "host" => "127.0.0.1", "port" => 8765 )))
}
$SERVER["socket"] == "[::]:80" {
  server.use-ipv6 = "enable"
  proxy.server = ( "" => ( "rega" => ( "host" => "127.0.0.1", "port" => 8765 )))
}

# :2001 und :2010 sind dem ping_shim.py reserviert (siehe Header-Kommentar).
