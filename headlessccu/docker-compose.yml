# SPDX-License-Identifier: GPL-2.0-or-later
# BusMatic-HASS — plain-Docker Compose-File (für Hosts ohne HA-Supervisor).
#
# Bringup:
#   git clone https://github.com/tostmann/headlessCCU
#   cd headlessCCU/headlessccu
#   ./build.sh                # baut Image (clont bmcond@tag intern)
#   docker compose up -d
#
# In HA (homematicip_local) als Host '127.0.0.1' konfigurieren — keine
# Custom-Ports nötig (seit v0.2.29 mappt lighttpd :80 → :8765 für die
# JSON-RPC-Default-Annahme von aiohomematic, und rega_session_mock liefert
# Interface.isPresent für Auto-Detection beider RF-Interfaces).
# Username/Password werden vom Mock nicht validiert — beliebige Werte.
#
# Belegte Ports am Host (network_mode: host):
#   :80    lighttpd-proxy  → 127.0.0.1:8765/api/homematic.cgi (rega_session_mock)
#   :8765  rega_session_mock direct (kein Routing nötig wenn :80 frei bleibt)
#   :2001  lighttpd-proxy  → 127.0.0.1:32001 (rfd BidCoS XML-RPC)
#   :2010  lighttpd-proxy  → 127.0.0.1:32010 (HMServer HmIP XML-RPC)
#   :9126  bmcond JSON-API / Ingress-WebUI
#
# ⚠ Wenn Host bereits :80 belegt: lighttpd-Block in
# rootfs/etc/lighttpd/lighttpd.conf entfernen + im HA-Setup
# `custom_port_config=true, json_port=8765` setzen.

services:
  headlessccu:
    image: headlessccu:2026.6.4
    build:
      # Build-Kontext = dieses Verzeichnis (HA-Supervisor-Konvention).
      # bmcond-Source wird vom Dockerfile selbst via git clone gezogen —
      # kein lokales Staging nötig.
      context: .
      dockerfile: Dockerfile
      # BuildKit's isolierter Netzwerk-Namespace bekommt apt.debmatic.de /
      # github.com manchmal nicht zuverlässig durch (TCP-resets mid-stream,
      # SSL-timeouts).  `network: host` lässt den Builder das Host-Netz nutzen
      # — DNS + Routing + ggf. HTTP(S)_PROXY-Vars wirken dann direkt.
      network: host
      args:
        BUILD_FROM: debian:bookworm-slim
        BMCOND_VERSION: ${BMCOND_VERSION:-2026.6.1}
        # Pin der eq-3-Bundle-Version aus apt.debmatic.de.  Beim Bump:
        # hier eintragen (Default = 3.85.7-123, /boot/VERSION=3.85.7.123).
        # Siehe Dockerfile-Kommentar zum ARG.  Overrides:
        #   DEBMATIC_VERSION=3.85.8-124 docker compose build   # neuer Pin
        #   DEBMATIC_VERSION=latest      docker compose build  # unpinned-Fallback
        DEBMATIC_VERSION: ${DEBMATIC_VERSION:-3.85.7-123}
    container_name: headlessccu
    restart: unless-stopped
    # network_mode: host ist nötig damit rfd's XML-RPC-Event-Callbacks den
    # HA-Container (selbst im network=host) auf 127.0.0.1:<callback-port>
    # erreichen.  Mit default-bridge wäre das Container-eigenes lo, das
    # nichts erreicht — Symptom: setValue funktional, aber HA bekommt keine
    # State-Bestätigung und macht OPTIMISTIC_ROLLBACK nach 30s.
    network_mode: host
    volumes:
      - ./data:/data            # persistente /etc/config (rfd-Keys, Pairings)
      # Host-/lib/modules read-only → der Container findet eq3_char_loop.ko und
      # kann es mit `modprobe` selbst laden (run.sh; kmod ist seit 2026.6.4 im
      # Image).  Pendant zu HAOS' `kernel_modules: true`.  OHNE diesen Mount
      # scheitert der Container-modprobe an der fehlenden .ko (Modul müsste
      # host-seitig vorgeladen sein) — mit ihm ist der Stack self-sufficient.
      - /lib/modules:/lib/modules:ro
      # avahi-daemon-Socket vom Host durchreichen, damit `avahi-browse` (in
      # /api/discover, Stage 47b.2) die Host-mDNS-DB benutzt — sonst müsste
      # der Container seinen eigenen avahi-daemon laufen lassen, der sich
      # mit dem Host-Daemon ums network_mode=host gegenseitig stört.
      - /var/run/avahi-daemon:/var/run/avahi-daemon:ro
      - /var/run/dbus:/var/run/dbus:ro
    devices:
      # libusb-direct: /dev/bus/usb durchreichen — Docker setzt automatisch
      # die device-cgroup-Rule für character-major 189 (usbfs).  Ein reiner
      # `-v /dev/bus/usb:/dev/bus/usb` Bind-Mount schafft die dev-Nodes
      # zwar im Container-Namespace, aber der device-cgroup blockt open()
      # mit EPERM. `devices:` umgeht das.
      - /dev/bus/usb:/dev/bus/usb
      # /dev/eq3loop wird BEWUSST NICHT durchgereicht (weder als `devices:` noch
      # als `-v`-Bind).  Grund: der eq3_char_loop-Node existiert nur in sysfs
      # (kein udev/devtmpfs-Node auf dem Host).  Reicht man ihn durch und der
      # Host-Node fehlt nach einem USB-/Modul-Event, dann
      #   - `devices: -/dev/eq3loop`  → `--device` schlägt fehl (Container startet nicht), bzw.
      #   - `-v /dev/eq3loop:/dev/eq3loop` → Docker legt die fehlende Quelle still
      #     als *leeres Verzeichnis* an, das den Namen dauerhaft shadowed und
      #     den init-mknod-Fallback aushebelt → exit 1 bei jedem Restart.
      # run.sh mknod't /dev/eq3loop ohnehin selbst aus sysfs (CAP_MKNOD +
      # device_cgroup_rules 'c 509:* rwm', beide unten gesetzt).  Voraussetzung:
      # eq3_char_loop ist auf dem Host geladen (run.sh: modprobe-Fallback).
      # Bug-Detail: BUG_eq3loop_bind_and_mmd_identify_2026-06-04.md.
    # device-cgroup-rule: char-major 509 alle minors freischalten.
    # `devices:` whitelisted nur 509:0 (eq3loop selbst).  multimacd erzeugt
    # /dev/mmd_bidcos (509:2) und /dev/mmd_hmip (509:1) zur Laufzeit per
    # mknod (CAP_MKNOD).  Ohne diese Regel blockt die device-cgroup das
    # open() — sichtbar als EPERM in strace von rfd/HMServer trotz mode 644.
    # Symptom-Kette: "Identify response string not handled: " (leer) → rfd
    # crash → container-loop.
    device_cgroup_rules:
      - 'c 509:* rwm'
    cap_add:
      - SYS_RAWIO              # libusb_detach_kernel_driver braucht ggf. CAP_SYS_RAWIO
      - MKNOD                  # multimacd: mknod /dev/mmd_bidcos + /dev/mmd_hmip
      - SYS_MODULE             # run.sh: modprobe eq3_char_loop falls Host noch nicht geladen
      - SYS_NICE               # multimacd: sched_setpriority für FastMacResponder-thread
    environment:
      # HMID "auto" (Default): run.sh würfelt beim Erststart eine 3-byte-HMID
      # und persistiert sie in ./data/etc-config/ids.  Bei Bedarf hier durch
      # 6-hex-String ersetzen oder via shell-env via `${BUSMATIC_HMID:-auto}`
      # parametrierbar machen — überschreibt das auto-Verhalten.
      BUSMATIC_HMID: "${BUSMATIC_HMID:-auto}"
      BUSMATIC_SERIAL: "${BUSMATIC_SERIAL:-BMC0000001}"
      BUSMATIC_FW: "${BUSMATIC_FW:-2.8.6}"
      BUSMATIC_BIDCOS_TRANSPORT: "usb=1b1f:c020"
      BUSMATIC_HMIP_TRANSPORT: "usb=1b1f:c020"
      BUSMATIC_LOGLEVEL: "3"
      REGA_MOCK_LOG_LEVEL: "INFO"
      # multimacd_shim=true → eq-3-multimacd übernimmt den vollen Mac-Layer
      # (DUTY/CSMA/AES/3burst-Retry).  Voraussetzung: cap_add MKNOD +
      # device /dev/eq3loop (siehe Kommentare oben).
      BUSMATIC_MULTIMACD_SHIM: "${BUSMATIC_MULTIMACD_SHIM:-false}"
